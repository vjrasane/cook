name: Release n8n-nodes-cooklang

on:
  push:
    tags:
      - 'n8n-nodes-cooklang/v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: n8n-nodes-cooklang
        run: npm ci

      - name: Build
        working-directory: n8n-nodes-cooklang
        run: npm run build

      - name: Publish
        working-directory: n8n-nodes-cooklang
        run: npm publish --provenance --access public
