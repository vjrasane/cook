name: Release Listonic CLI

on:
  push:
    tags:
      - 'listonic-cli/v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: listonic-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#listonic-cli/}"
          go build -ldflags "-X main.Version=${VERSION}" -o "listonic-${GOOS}-${GOARCH}" .

      - uses: actions/upload-artifact@v4
        with:
          name: listonic-${{ matrix.goos }}-${{ matrix.goarch }}
          path: listonic-cli/listonic-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/listonic-*
